comparisons:
- hists:
  - [data/simulation_a.root, energy_spectrum, Simulation A, kP6Blue, 0]
  - [data/simulation_b.root, energy_spectrum, Simulation B, kP6Yellow, 1]
  - [data/simulation_c.root, energy_spectrum, Simulation C, kP6Red, 2]
  output: legend_input_order
  title: Energy Spectrum Comparison (Legend in Input Order)
  x_label: Energy (MeV)
  y_label: Count
  logy: true
- hists:
  - [data/simulation_a.root, energy_spectrum, Simulation A, kP6Blue, 2]
  - [data/simulation_b.root, energy_spectrum, Simulation B, kP6Yellow, 1]
  - [data/simulation_c.root, energy_spectrum, Simulation C, kP6Red, 0]
  output: legend_reversed
  title: Energy Spectrum Comparison (Legend Reversed)
  x_label: Energy (MeV)
  y_label: Count
  logy: true
  legend_position: top_left
- hists:
  - [data/simulation_a.root, energy_spectrum, Simulation A, kP6Blue, 1]
  - [data/simulation_b.root, energy_spectrum, Simulation B, kP6Yellow, 2]
  - [data/simulation_c.root, energy_spectrum, Simulation C, kP6Red, 0]
  output: legend_custom_order
  title: Energy Spectrum Comparison (Custom Numeric Legend Order)
  x_label: Energy (MeV)
  y_label: Count
  logy: true
  legend_position: bottom_right
