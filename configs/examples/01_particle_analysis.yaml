# Replace input_directory with the directory containing your FLUKA ROOT files.
input_directory: ./simulation
particle:
  particle_id: 8
  name: neutrons
  variable: EKin
  weight: Weight1
new_variable:
  name: EKin
  expression: ETot - 0.939565378
output:
  base_name: analysis
  directory: ./results
  include_timestamp: false
  format_template: '{base_name}_{particle_name}_{n_bins}bins_{min_energy}_{max_energy}.root'
histograms:
  - n_bins: 200
    min_energy: 0.0001
    max_energy: 10.0
    also_log_bins: true
surfaces:
  - id: 1000
    name: detector
    xl: -30
    xh: 30
    yl: -30
    yh: 30
    bin_width: 1.5
    spatial_analysis: true
