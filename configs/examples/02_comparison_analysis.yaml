# Generate these input analyses first, or replace the file/histogram names.
comparisons:
  - output: config_comparison
    output_directory: ./results/comparisons
    hists:
      - [results/config_a.root, neutrons_h1_detector_log, Configuration A, kP6Blue, 0]
      - [results/config_b.root, neutrons_h1_detector_log, Configuration B, kP6Yellow, 1]
      - [results/config_c.root, neutrons_h1_detector_log, Configuration C, kP6Red, 2]
    title: Neutron spectrum comparison
    x_label: Kinetic energy [GeV]
    y_label: n/(GeV EOT)
    logx: true
    logy: true
    x_min: 0.0001
    x_max: 10.0
    line_width: 2
    legend_position: top_right
    draw_option: hist
