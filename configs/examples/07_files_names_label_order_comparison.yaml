# Comparison examples using files_names_label and files_names_labels_order

comparisons:
  - output: "files_names_label_demo"
    title: "Comparison with files_names_label"
    logx: true
    logy: true
    files_names_label:
      - ["/path/to/config_a.root", "neutrons_h1_fl_1000_enclose_lin", "Config A"]
      - ["/path/to/config_b.root", "neutrons_h1_fl_1000_enclose_lin", "Config B"]
      - ["/path/to/config_c.root", "neutrons_h1_fl_1000_enclose_lin", "Config C"]

  - output: "files_names_labels_order_demo"
    title: "Comparison with files_names_labels_order"
    logx: true
    logy: true
    files_names_labels_order:
      - ["/path/to/config_a.root", "neutrons_h1_fl_1000_enclose_lin", "Config A", 2]
      - ["/path/to/config_b.root", "neutrons_h1_fl_1000_enclose_lin", "Config B", 0]
      - ["/path/to/config_c.root", "neutrons_h1_fl_1000_enclose_lin", "Config C", 1]
